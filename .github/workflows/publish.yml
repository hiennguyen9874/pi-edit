name: Publish pi-multi-edit to npm

on:
  push:
    tags: ["multi-v*"] # pi-multi-edit only; main (pi-single-edit) uses plain v* tags

permissions:
  contents: read
  id-token: write # required for npm Trusted Publishing (OIDC) + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # Trusted Publishing needs npm >= 11.5.1
      - run: npm ci
      - run: npm test
      - name: Verify tag matches package version
        run: |
          PKG_VERSION="multi-v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi
      - name: Verify package name
        run: |
          PKG_NAME="$(node -p "require('./package.json').name")"
          if [ "$PKG_NAME" != "@hiennguyen9874/pi-multi-edit" ]; then
            echo "Unexpected package name: $PKG_NAME (expected @hiennguyen9874/pi-multi-edit)"
            exit 1
          fi
      - run: npm publish --access public
